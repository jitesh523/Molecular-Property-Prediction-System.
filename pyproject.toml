[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molprop"
version = "2.45.0"
description = "A production-grade, end-to-end platform for predicting molecular properties using GNNs."
keywords = ["molecular-informatics", "gnn", "mlops", "drug-discovery", "pytorch-geometric"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jitesh523", email = "test@example.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "rdkit>=2023.9.5",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "chembl_webresource_client>=0.10.8",
    "shap>=0.46.0",
    "optuna>=3.6.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "umap-learn>=0.5.5",
    "scipy>=1.12.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "captum>=0.7.0",
    "stmol>=0.0.9",
    "py3Dmol>=2.0",
    "rich>=13.7.1",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "qdrant-client>=1.9.0",
    "tabulate>=0.9.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "dvc>=3.49.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0"
]

[project.scripts]
molprop = "molprop.cli:main"
molprop-dashboard = "molprop.scripts.portfolio_dashboard:main"
molprop-train = "molprop.scripts.train_gnn:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["molprop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "S",   # flake8-bandit
]
ignore = [
    "E501", # line too long, let formatter handle it
    "S101", # allow assert for pytest
]

[tool.black]
line-length = 120
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["molprop"]
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["venv", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Too strict for now
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "torch.*",
    "torch_geometric.*",
    "optuna.*",
    "sklearn.*",
    "xgboost.*",
    "streamlit.*",
]
ignore_missing_imports = true
